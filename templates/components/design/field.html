<div class="ui-field"><label for="{{ field.id_for_label }}" class="block text-sm font-semibold mb-1">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span><span class="sr-only"> (obligatorio)</span>{% endif %}</label>{{ field }}{% if field.help_text %}<p id="{{ field.auto_id }}_helptext" class="muted mt-1">{{ field.help_text }}</p>{% endif %}{% if field.errors %}<div id="{{ field.auto_id }}_error" class="field-errors">{{ field.errors }}</div>{% endif %}</div>
